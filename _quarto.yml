project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "analysis/QG3_*_practical.qmd"
    - "!analysis/*_Key.qmd"

website:
  title: "SISG 2026 - Association Mapping"
  navbar:
    background: primary
    left:
      - text: "Home"
        href: index.qmd
      - text: "Practicals"
        menu:
          - text: "Session 1: Association Testing"
            href: analysis/QG3_Association_Testing_practical.qmd
          - text: "Session 2: PLINK & Population Structure"
            href: analysis/QG3_Plink_Population_Structure_practical.qmd
          - text: "Session 3: Relatedness & REGENIE"
            href: analysis/QG3_Relatedness_REGENIE_practical.qmd
          - text: "Session 4: Rare Variant Tests"
            href: analysis/QG3_RV_tests_practical.qmd
          - text: "Session 5: Beyond Standard GWAS"
            href: analysis/QG3_Beyond_Standard_GWAS_practical.qmd
          - text: "Session 6: Downstream Analyses"
            href: analysis/QG3_Downstream-Analyses_practical.qmd
          - text: "Session 7: Polygenic Scores"
            href: analysis/QG3_Polygenic_Scores_practical.qmd
          - text: "Session 9: Power & Design"
            href: analysis/QG3_Power-Design_practical.qmd
          - text: "Session 10: Case-Control Imbalance"
            href: analysis/QG3_CC_Imbalance_practical.qmd
    right:
      - icon: github
        href: https://github.com/joellembatchou/SISG2026_Association_Mapping
        aria-label: GitHub

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 3
    code-fold: false
    code-tools: true
    df-print: paged

execute:
  freeze: auto
